<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#4c1d95" />
      <stop offset="100%" stop-color="#0f0c1b" />
    </linearGradient>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a78bfa" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fundo Sombrio -->
  <rect width="256" height="256" rx="48" fill="#09090b" />
  <rect width="252" height="252" x="2" y="2" rx="46" fill="none" stroke="#27272a" stroke-width="2" />

  <!-- Escudo Cyberpunk -->
  <path d="M 128 32 L 208 64 C 208 152 168 208 128 228 C 88 208 48 152 48 64 Z" 
        fill="url(#shieldGrad)" stroke="#8b5cf6" stroke-width="4" filter="url(#glow)" />

  <!-- Grade de Tripwire Interna -->
  <path d="M 80 88 L 176 88 M 72 120 L 184 120 M 80 152 L 176 152" 
        stroke="#a78bfa" stroke-width="2" stroke-dasharray="4 4" opacity="0.6" />
  <path d="M 128 64 L 128 200" 
        stroke="#a78bfa" stroke-width="2" stroke-dasharray="6 4" opacity="0.6" />

  <!-- Mira Central / Olho de Detecção -->
  <circle cx="128" cy="120" r="24" fill="none" stroke="url(#neonGlow)" stroke-width="3" />
  <circle cx="128" cy="120" r="10" fill="#10b981" />
  <circle cx="128" cy="120" r="3" fill="#ffffff" />

  <!-- Bordas Angulares Táticas -->
  <path d="M 112 50 L 144 50" stroke="#10b981" stroke-width="3" stroke-linecap="round" />
  <path d="M 128 200 L 128 218" stroke="#8b5cf6" stroke-width="3" stroke-linecap="round" />
</svg>
